server.port=8080

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**

logging.level.com.edu.wikipro=debug

spring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.druid.url=jdbc:mysql://127.0.0.1:3306/shopdb?useSSL=false&characterEncoding=utf-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.druid.username=root
spring.datasource.druid.password=你的数据库密码

spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000

mybatis-plus.type-aliases-package=com.edu.wikipro.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 支付宝沙箱配置（在支付宝开放平台沙箱环境中申请，密钥不要提交到公开仓库）
alipay.app-id=你的沙箱APPID
alipay.private-key=你的应用私钥
alipay.public-key=你的支付宝公钥
alipay.gateway=https://openapi-sandbox.dl.alipaydev.com/gateway.do
alipay.notify-url=http://你的公网域名/alipay/notify
alipay.return-url=http://你的公网域名/alipay/return
